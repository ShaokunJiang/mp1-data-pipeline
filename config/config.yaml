validation:
  required_columns:
    - record_id
    - name
    - rating
    - category
    - status
  numeric_columns:
    - record_id
    - rating
processing:
  remove_duplicates: true
  handle_missing:
    enabled: true
    axis: "rows"
  remove_outliers:
    enabled: true
    columns:
      - rating
    method: "iqr"
    threshold: 1.5